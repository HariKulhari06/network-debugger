name: Publish Release

on:
  push:
    tags:
      - 'v*'
      - '[0-9]*'

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build Release AARs & Publish
        run: ./gradlew publishToMavenLocal assembleRelease
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            network-debugger/build/outputs/aar/*.aar
            network-debugger-core/build/outputs/aar/*.aar
            network-debugger-okhttp/build/outputs/aar/*.aar
            network-debugger-manual/build/outputs/aar/*.aar
            network-debugger-storage/build/outputs/aar/*.aar
            network-debugger-ui/build/outputs/aar/*.aar
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
